services:
  web:
    build: .
    container_name: gallery_web_app
    restart: always
    env_file:
      - env/.env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
